<VirtualHost *:10000>
    ServerName localhost
    DocumentRoot /var/www/app/deploy/public
    <Directory /var/www/app/deploy/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteRule ^ index.php [END]
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
